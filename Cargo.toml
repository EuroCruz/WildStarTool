[package]
name = "wildstartool"
version = "1.0.0"
edition = "2021"
description = "The Saboteur modding tool"
repository = "https://github.com/EuroCruz/WildStarTool"

[[bin]]
name = "wildstartool"
path = "src/main.rs"

[dependencies]
ac-core = { path = "../ACLibriary/crates/core" }
ac-pack = { path = "../ACLibriary/crates/pack" }
ac-fmt = { path = "../ACLibriary/crates/fmt" }
ac-lua = { path = "../ACLibriary/crates/lua" }

[build-dependencies]
ac-lua = { path = "../ACLibriary/crates/lua" }
ac-pack = { path = "../ACLibriary/crates/pack" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
